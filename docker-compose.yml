version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  postgres_data:

services:
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80" 
    networks:
      - frontend-net
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: always
    environment:
      - DB_HOST=db 
      - DB_NAME=mydb
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy 

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d 
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5